<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PT Booking — Coach Reinhart</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Inter;
background:#0b1220;
color:#e5e7eb;
padding-bottom:140px;
}

.container{max-width:1000px;margin:auto;padding:20px}

.btn{
padding:16px 24px;
border-radius:14px;
font-weight:700;
text-decoration:none;
display:inline-flex;
align-items:center;
gap:8px;
margin:8px;
transition:.2s;
cursor:pointer;
}

.btn.primary{
background:#3b82f6;
color:#fff;
box-shadow:0 6px 20px rgba(59,130,246,.6);
border:2px solid rgba(255,255,255,.3);
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 10px rgba(59,130,246,.5)}
to{box-shadow:0 0 25px rgba(59,130,246,.9)}
}

.btn.secondary{background:#22d3ee;color:#0b1220}

.btn.whatsapp{
background:#25D366;
color:#fff;
box-shadow:0 6px 18px rgba(37,211,102,.5);
}

/* ✅ Instagram button */
.btn.instagram{
background:linear-gradient(135deg,#833ab4,#c13584,#e1306c,#fd1d1d,#f77737);
color:#fff;
box-shadow:0 6px 18px rgba(193,53,132,.4);
}

.btn:hover{transform:scale(1.05)}
.btn:active{transform:scale(.97)}

.section{
margin-top:20px;
padding:18px;
border-radius:14px;
background:#111827;
}

.calendar-frame{height:600px;margin-top:10px}
iframe{width:100%;height:100%;border:0}

.tab{
cursor:pointer;
padding:10px 14px;
background:#1f2937;
border-radius:8px;
display:inline-block;
margin-right:5px;
transition:.2s;
}
.tab.active{background:#3b82f6}
.tab-content{display:none}
.tab-content.active{display:block}

input,select{
width:100%;
padding:12px;
margin-top:6px;
border-radius:10px;
background:#0b1220;
color:#fff;
border:1px solid #333;
}

.sticky{
position:fixed;
bottom:0;
width:100%;
background:#0b1220;
padding:12px;
text-align:center;
transform:translateY(100%);
transition:.3s;
z-index:999;
}
.sticky.show{transform:translateY(0)}

.lang-switch{margin-bottom:10px}
.lang-btn{
padding:6px 10px;
border-radius:8px;
border:1px solid #444;
background:#0b1220;
color:#fff;
cursor:pointer;
margin-right:5px;
}
.lang-btn.active{background:#3b82f6}

.library-grid{
display:grid;
gap:12px;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
margin-top:12px;
}
.lib-card{
background:#0b1220;
border:1px solid rgba(148,163,184,.25);
border-radius:12px;
padding:16px;
}

.section:hover{transform:translateY(-2px);transition:.2s}
</style>
</head>

<body>
<div class="container">

<div class="lang-switch">
<button class="lang-btn" data-lang="id">🇮🇩 ID</button>
<button class="lang-btn" data-lang="en">🇬🇧 EN</button>
</div>

<h1 id="title"></h1>
<p id="subtitle"></p>

<div class="section">
<a class="btn primary" href="https://bit.ly/PT-Booking-Reinhart" target="_blank">📘 Book Sekarang</a>
<a class="btn secondary" href="https://forms.gle/BqhfY4Rrbhf9NbZP9" target="_blank">✏️ Client Feedback</a>
<a class="btn whatsapp" href="https://wa.me/6285959735630" target="_blank">💬 WhatsApp</a>
<a class="btn instagram" href="https://instagram.com/sulaimanreinhart" target="_blank">📷 Instagram</a>
</div>

<div class="section">
<h2 id="scheduleTitle">📅 Schedule</h2>
<div class="calendar-frame">
<iframe src="https://calendar.google.com/calendar/embed?wkst=7&ctz=Asia%2FJakarta&mode=WEEK&src=cmVpbmhhcnRzdWxhaW1hbkBnbWFpbC5jb20"></iframe>
</div>
</div>

<div class="section">
<h2 id="toolsTitle">🛠 Tools</h2>

<div>
<span class="tab active" data-tab="macro">Macro</span>
<span class="tab" data-tab="rpe">RPE</span>
<span class="tab" data-tab="library">Library</span>
</div>

<div id="macro" class="tab-content active">
<p id="macroDesc"></p>

<input id="weight" placeholder="Weight">
<input id="height" placeholder="Height">
<input id="age" placeholder="Age">

<select id="activity">
<option>Sedentary</option>
<option>Moderate</option>
<option>Active</option>
</select>

<select id="goal">
<option>Cut</option>
<option>Maintain</option>
<option>Bulk</option>
</select>

<input id="meals" placeholder="Meals/day">

<button class="btn" onclick="calcMacro()" id="btnCalcMacro">Calculate</button>
<div id="macroResult"></div>
</div>

<div id="rpe" class="tab-content">
<p id="rpeDesc"></p>

<input id="lw" placeholder="Weight">
<input id="lr" placeholder="Reps">
<input id="lrpe" placeholder="RPE">
<input id="trpe" placeholder="Target">

<button class="btn" onclick="calcRPE()" id="btnCalcRPE">Calculate</button>
<div id="rpeResult"></div>
</div>

<div id="library" class="tab-content">
<div class="library-grid">

<div class="lib-card">
<strong>Leg Day</strong><br>
<a class="btn secondary" target="_blank" href="https://drive.google.com/drive/folders/1LipGAf-ZUNBOxPy-kE7rmLvHkCLFwIK7">Open</a>
</div>

<div class="lib-card">
<strong>Push Day</strong><br>
<a class="btn secondary" target="_blank" href="https://drive.google.com/drive/folders/1Ji1jzJpQkFollEmlOwvCmvVDj3uQ7lme">Open</a>
</div>

<div class="lib-card">
<strong>Pull Day</strong><br>
<a class="btn secondary" target="_blank" href="https://drive.google.com/drive/folders/1MXtRYeJjjzkAhz4CQmvAB0NYOIso7G6b">Open</a>
</div>

<div class="lib-card">
<strong>Mobility</strong><br>
<a class="btn secondary" target="_blank" href="https://drive.google.com/drive/folders/1PEmK0KWcsuAiZcEZ6m_ujhmGwKgMMkaZ">Open</a>
</div>

</div>
</div>

</div>
</div>

<div id="sticky" class="sticky">
<a href="https://bit.ly/PT-Booking-Reinhart" class="btn primary">📘 Book Sekarang</a>
</div>

<script>

// i18n
const i18n={
id:{
title:"Booking & Training Tools — Coach Reinhart",
subtitle:"Booking jadwal, lihat ketersediaan real-time, kalkulator latihan, dan exercise library.",
book:"📘 Book Sekarang",
feedback:"✏️ Client Feedback",
wa:"💬 WhatsApp",
ig:"📷 Instagram",
schedule:"📅 Schedule",
tools:"🛠 Tools",
macro:"Macro",
rpe:"RPE",
library:"Library",
macroDesc:"Estimasi kalori & makronutrien harian berdasarkan data tubuh dan aktivitas.",
weight:"Berat",
height:"Tinggi",
age:"Usia",
meals:"Makan / hari",
calc:"Hitung",
rpeDesc:"Estimasi beban latihan selanjutnya."
},
en:{
title:"Training Booking & Tools - Coach Reinhart",
subtitle:"Book sessions, view coaching schedule availability, macronutrient calculator, and exercise library.",
book:"📘 Book Now",
feedback:"✏️ Client Feedback",
wa:"💬 WhatsApp",
ig:"📷 Instagram",
schedule:"📅 Schedule",
tools:"🛠 Tools",
macro:"Macro",
rpe:"RPE",
library:"Library",
macroDesc:"Estimate daily calories & macronutrients based on your body stats and activity level.",
weight:"Weight",
height:"Height",
age:"Age",
meals:"Meals/day",
calc:"Calculate",
rpeDesc:"Estimate next load."
}
}

function applyLang(lang){
const t=i18n[lang]

title.innerText=t.title
subtitle.innerText=t.subtitle

document.querySelector('.btn.primary').innerText=t.book
document.querySelectorAll('.btn.secondary')[0].innerText=t.feedback
document.querySelector('.btn.whatsapp').innerText=t.wa
document.querySelector('.btn.instagram').innerText=t.ig
document.querySelector('#sticky .btn').innerText=t.book

scheduleTitle.innerText=t.schedule
toolsTitle.innerText=t.tools

document.querySelector('[data-tab="macro"]').innerText=t.macro
document.querySelector('[data-tab="rpe"]').innerText=t.rpe
document.querySelector('[data-tab="library"]').innerText=t.library

macroDesc.innerText=t.macroDesc

weight.placeholder=t.weight
height.placeholder=t.height
age.placeholder=t.age
meals.placeholder=t.meals

btnCalcMacro.innerText=t.calc
btnCalcRPE.innerText=t.calc

rpeDesc.innerText=t.rpeDesc

document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'))
document.querySelector(`.lang-btn[data-lang="${lang}"]`).classList.add('active')
}

// init
const userLang=navigator.language.startsWith('id')?'id':'en'
applyLang(userLang)

document.querySelectorAll('.lang-btn').forEach(btn=>{
btn.onclick=()=>applyLang(btn.dataset.lang)
})

// tabs
document.querySelectorAll('.tab').forEach(t=>{
t.onclick=()=>{
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'))
document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'))
t.classList.add('active')
document.getElementById(t.dataset.tab).classList.add('active')
}
})

// macro
function calcMacro(){
let w=+weight.value,h=+height.value,a=+age.value
if(!w||!h||!a){macroResult.innerText='Fill all';return}
let bmr=10*w+6.25*h-5*a+5
let tdee=bmr*1.5
let cal=tdee*0.8
let protein=w*1.8
let fat=w*0.8
let carbs=(cal-(protein*4+fat*9))/4
macroResult.innerText=`${Math.round(cal)} kcal | P:${protein} F:${fat} C:${Math.round(carbs)}`
}

// rpe
function calcRPE(){
if(!lw.value||!lr.value){rpeResult.innerText='Fill';return}
let oneRM=lw.value*(1+lr.value/30)
rpeResult.innerText=`1RM ${oneRM.toFixed(1)}`
}

// sticky
window.addEventListener('scroll',()=>{
if(window.scrollY>200){sticky.classList.add('show')}
else{sticky.classList.remove('show')}
})

</script>
</body>
</html>
