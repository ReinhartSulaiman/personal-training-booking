<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PT Booking — Coach Reinhart</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Inter;background:#0b1220;color:#e5e7eb;padding-bottom:90px}
.container{max-width:1000px;margin:auto;padding:20px}

/* Language */
.lang-switch{display:flex;gap:8px;margin-bottom:8px}
.lang-btn{
padding:6px 10px;border-radius:8px;border:1px solid rgba(148,163,184,.35);
background:#0b1220;color:#cbd5e1;cursor:pointer;font-weight:600;
}
.lang-btn.active{background:#3b82f6;color:#0b1220}

/* Buttons */
.btn{
padding:16px 22px;border-radius:14px;font-weight:700;text-decoration:none;
display:inline-block;margin:8px;transition:.2s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}

.btn.primary{
background:#3b82f6;color:#fff;
box-shadow:0 6px 20px rgba(59,130,246,.5);
animation:pulse 2.2s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(59,130,246,.6)}
70%{box-shadow:0 0 0 14px rgba(59,130,246,0)}
100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}
}

.btn.secondary{background:#22d3ee;color:#0b1220}

.btn.whatsapp{
background:#25D366;color:#0b1220;
box-shadow:0 6px 20px rgba(37,211,102,.4);
}

/* Sections */
.section{
margin-top:20px;padding:16px;border-radius:12px;
background:#111827;transition:.25s;
}
.section:hover{transform:translateY(-2px)}

/* Calendar */
.calendar-frame{height:650px;margin-top:10px}
iframe{width:100%;height:100%;border:0}

/* Tabs */
.tab{
cursor:pointer;padding:10px;background:#1f2937;
border-radius:8px;display:inline-block;margin-right:5px
}
.tab.active{background:#3b82f6}
.tab-content{display:none}
.tab-content.active{display:block}

/* Form */
input,select{
width:100%;padding:10px;margin-top:5px;
border-radius:8px;background:#0b1220;color:#fff;border:1px solid #333
}

/* Library */
.library-grid{
display:grid;gap:12px;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
}
.lib-card{
background:#0b1220;padding:14px;border-radius:10px;border:1px solid #333;
}

/* Sticky */
.sticky{
position:fixed;bottom:0;width:100%;background:#0b1220;
padding:10px;text-align:center;transform:translateY(100%);transition:.3s
}
.sticky.show{transform:translateY(0)}
</style>
</head>

<body>
<div class="container">

<!-- Language -->
<div class="lang-switch">
<button class="lang-btn" data-lang="id">🇮🇩 ID</button>
<button class="lang-btn" data-lang="en">🇬🇧 EN</button>
</div>

<h1 id="title"></h1>
<p id="subtitle"></p>

<!-- Buttons -->
<div class="section">
<a class="btn primary" href="https://bit.ly/PT-Booking-Reinhart" target="_blank">📘 Book Sekarang</a>
<a class="btn secondary" href="https://forms.gle/BqhfY4Rrbhf9NbZP9" target="_blank">✏️ Client Feedback</a>
<a class="btn whatsapp" href="https://wa.me/6285959735630" target="_blank">💬 WhatsApp</a>
</div>

<!-- Calendar -->
<div class="section">
<h2>📅 Schedule</h2>

<div class="calendar-frame">
<iframe src="https://calendar.google.com/calendar/embed?wkst=7&ctz=Asia%2FJakarta&mode=WEEK&src=cmVpbmhhcnRzdWxhaW1hbkBnbWFpbC5jb20"></iframe>
</div>

</div>

<!-- Tools -->
<div class="section">
<h2>🛠 Tools</h2>

<div>
<span class="tab active" data-tab="macro">Macro</span>
<span class="tab" data-tab="rpe">RPE</span>
<span class="tab" data-tab="library">Library</span>
</div>

<!-- Macro -->
<div id="macro" class="tab-content active">
<p style="color:#94a3b8;font-size:14px">
Estimate daily calories & macronutrients based on your body stats and activity level.
</p>

<input id="weight" placeholder="Weight">
<input id="height" placeholder="Height">
<input id="age" placeholder="Age">

<select id="activity">
<option value="1.3">Sedentary</option>
<option value="1.6">Moderate</option>
<option value="1.75">Active</option>
</select>

<select id="goal">
<option value="cut">Cut</option>
<option value="maintain">Maintain</option>
<option value="bulk">Bulk</option>
</select>

<input id="meals" placeholder="Meals/day">

<button class="btn" onclick="calcMacro()">Calculate</button>
<div id="macroResult"></div>
</div>

<!-- RPE -->
<div id="rpe" class="tab-content">
<p>Estimate next load.</p>
<input id="lw" placeholder="Weight">
<input id="lr" placeholder="Reps">
<input id="lrpe" placeholder="RPE">
<input id="trpe" placeholder="Target">
<button class="btn" onclick="calcRPE()">Calculate</button>
<div id="rpeResult"></div>
</div>

<!-- Library -->
<div id="library" class="tab-content">
<div class="library-grid">

<div class="lib-card">
<strong>Leg Day</strong><br>
<a class="btn secondary" target="_blank" href="https://drive.google.com/drive/folders/1LipGAf-ZUNBOxPy-kE7rmLvHkCLFwIK7">Open</a>
</div>

<div class="lib-card">
<strong>Push Day</strong><br>
<a class="btn secondary" target="_blank" href="https://drive.google.com/drive/folders/1Ji1jzJpQkFollEmlOwvCmvVDj3uQ7lme">Open</a>
</div>

<div class="lib-card">
<strong>Pull Day</strong><br>
<a class="btn secondary" target="_blank" href="https://drive.google.com/drive/folders/1MXtRYeJjjzkAhz4CQmvAB0NYOIso7G6b">Open</a>
</div>

<div class="lib-card">
<strong>Mobility</strong><br>
<a class="btn secondary" target="_blank" href="https://drive.google.com/drive/folders/1PEmK0KWcsuAiZcEZ6m_ujhmGwKgMMkaZ">Open</a>
</div>

</div>
</div>

</div>
</div>

<!-- Sticky -->
<div id="sticky" class="sticky">
<a href="https://bit.ly/PT-Booking-Reinhart" class="btn primary">📘 Book Sekarang</a>
</div>

<script>

// i18n
const i18n={
id:{
title:"Booking & Training Tools — Coach Reinhart",
subtitle:"Booking jadwal, lihat ketersediaan real-time, kalkulator latihan, dan exercise library."
},
en:{
title:"Training Booking & Tools - Coach Reinhart",
subtitle:"Book sessions, view coaching schedule availability, macronutrient calculator, and exercise library."
}
}

const lang=navigator.language.startsWith('id')?'id':'en'
document.getElementById('title').innerText=i18n[lang].title
document.getElementById('subtitle').innerText=i18n[lang].subtitle

// language switch
document.querySelectorAll('.lang-btn').forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'))
btn.classList.add('active')
const l=btn.dataset.lang
title.innerText=i18n[l].title
subtitle.innerText=i18n[l].subtitle
}
})

// tabs
document.querySelectorAll('.tab').forEach(t=>{
t.onclick=()=>{
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'))
document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'))
t.classList.add('active')
document.getElementById(t.dataset.tab).classList.add('active')
}
})

// macro
function calcMacro(){
let w=+weight.value,h=+height.value,a=+age.value
if(!w||!h||!a){macroResult.innerText='Fill all';return}
let bmr=10*w+6.25*h-5*a+5
let tdee=bmr*activity.value
let deficit=goal.value==='cut'?0.2:goal.value==='bulk'?-0.1:0
let cal=tdee*(1-deficit)
let protein=w*1.8
let fat=w*0.8
let carbs=(cal-(protein*4+fat*9))/4
macroResult.innerText=`${Math.round(cal)} kcal | P:${protein} F:${fat} C:${Math.round(carbs)}`
}

// rpe
function calcRPE(){
if(!lw.value||!lr.value){rpeResult.innerText='Fill';return}
let oneRM=lw.value*(1+lr.value/30)
rpeResult.innerText=`1RM ${oneRM.toFixed(1)}`
}

// sticky
window.addEventListener('scroll',()=>{
if(window.scrollY>200){sticky.classList.add('show')}
else{sticky.classList.remove('show')}
})

</script>
</body>
</html>
